<!DOCTYPE html>
<!-- Hearth's colours live in src/themes.css under [data-theme="paper"]. -->
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No site icon (on purpose): an empty data URI stops browsers fetching /favicon.ico. -->
    <link rel="icon" href="data:," />
    <title>Hearth</title>
    <meta name="description" content="Talk or type about your day. Hearth reflects back what it heard, finds what lifts you and what wears you down, and helps you build tiny habits." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Nanum+Pen+Script&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&display=swap" rel="stylesheet" />
    <!--
      First-paint background, so the page isn't white until the CSS arrives.
      Mirrors --color-background in src/themes.css.
    -->
    <style>
      html[data-theme="paper"] { background-color: #f6f1e8; color-scheme: light; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
